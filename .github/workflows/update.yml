name: OPUS automatic data update
on:
  schedule:
    - cron: '15 5 * * *'
    - cron: '15 12 * * 5,6,0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch, predict, settle and backtest
        run: python app/update.py
      - name: Commit generated data
        run: |
          git config user.name "opus-probability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data raw
          git diff --cached --quiet || git commit -m "OPUS automated update"
          git push
